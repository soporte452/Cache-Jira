---
- name: Automatización de Limpieza de Caché y Respuesta a Jira
  hosts: all
  become: false
  gather_facts: false

  vars:
    jira_base_url: "{{ jira_server | regex_replace('/$', '') }}"
    jira_user: "{{ vault_jira_user }}"
    jira_api_token: "{{ vault_jira_token }}"

  tasks:
    - name: 1. Crear directorio de caché de prueba si no existe
      ansible.builtin.file:
        path: /tmp/app_cache/
        state: directory
        mode: '0755'

    - name: 2. Ejecutar limpieza de archivos de caché
      ansible.builtin.file:
        path: /tmp/app_cache/
        state: absent
      register: clean_result

    - name: 3. Recrear directorio de caché limpio
      ansible.builtin.file:
        path: /tmp/app_cache/
        state: directory
        mode: '0755'

    - name: 4. Obtener automáticamente el último ticket creado en Jira (si no vino por Webhook)
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ jira_base_url }}/rest/api/3/search/jql"
        method: POST
        user: "{{ jira_user }}"
        password: "{{ jira_api_token }}"
        force_basic_auth: true
        body_format: json
        return_content: true
        status_code: 200
        body:
          jql: "created >= -30d ORDER BY created DESC"
          maxResults: 1
          fields:
            - key
            - creator
      register: ultimo_ticket_jira
      when: tower_webhook_payload is not defined

    - name: 5. Definir datos dinámicos del ticket recién creado
      ansible.builtin.set_fact:
        jira_issue_key: "{{ tower_webhook_payload.issue.key if (tower_webhook_payload is defined) else ultimo_ticket_jira.json.issues[0].key }}"
        jira_issue_creator: "{{ tower_webhook_payload.issue.fields.creator.displayName if (tower_webhook_payload is defined) else ultimo_ticket_jira.json.issues[0].fields.creator.displayName }}"

    - name: 6. Notificar a Jira que el trabajo está listo
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ jira_base_url }}/rest/api/2/issue/{{ jira_issue_key }}/comment"
        method: POST
        user: "{{ jira_user }}"
        password: "{{ jira_api_token }}"
        force_basic_auth: true
        body_format: json
        status_code: 201
        body:
          body: |
            Hola {{ jira_issue_creator }},

            ✅ Automatización Completada.
            Ansible Automation Platform ha procesado el ticket {{ jira_issue_key }}. La caché de los servidores ha sido limpiada exitosamente.

            Ya puedes proceder a cerrar este ticket.
      when: not clean_result.failed
