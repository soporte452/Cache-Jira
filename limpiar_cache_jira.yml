---

---
- name: Automatización de Limpieza de Caché y Respuesta a Jira
  hosts: all
  become: false
  gather_facts: false

  vars:
    jira_server: "https://ess-solutionsca-sandbox.atlassian.net"
    jira_user: "{{ vault_jira_user }}"
    jira_api_token: "{{ vault_jira_token }}"
    jira_issue_key: "{{ tower_webhook_payload.issue.key | default('TICKET-TEST-01') }}"
    jira_issue_creator: "{{ tower_webhook_payload.issue.fields.creator.displayName | default('Usuario') }}"

  tasks:
    - name: 1. Crear directorio de caché de prueba si no existe
      ansible.builtin.file:
        path: /tmp/app_cache/
        state: directory
        mode: '0755'

    - name: 2. Ejecutar limpieza de archivos de caché
      ansible.builtin.file:
        path: /tmp/app_cache/
        state: absent
      register: clean_result

    - name: 3. Recrear directorio de caché limpio
      ansible.builtin.file:
        path: /tmp/app_cache/
        state: directory
        mode: '0755'

    - name: 4. Notificar a Jira que el trabajo está listo
      delegate_to: localhost
      ansible.builtin.uri:
        url: "{{ jira_server }}/rest/api/2/issue/{{ jira_issue_key }}/comment"
        method: POST
        user: "{{ jira_user }}"
        password: "{{ jira_api_token }}"
        force_basic_auth: true
        body_format: json
        status_code: 201
        body:
          body: |
            Hola {{ jira_issue_creator }},

            ✅ Automatización Completada.
            Ansible Automation Platform ha procesado este ticket. La caché de los servidores ha sido limpiada exitosamente.

            Ya puedes proceder a cerrar este ticket.
      when: not clean_result.failed
